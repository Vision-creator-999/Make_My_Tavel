<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard – Make My Travel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .admin-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      border-bottom: 1.5px solid var(--color-border);
      padding-bottom: 20px;
    }
    
    .admin-title-area {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .admin-title-area h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: var(--color-text-heading);
    }
    
    .admin-badge {
      background-color: var(--color-secondary);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    /* Stats Row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 32px;
    }
    
    .stat-card {
      background-color: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow-sm);
      text-align: left;
    }
    
    .stat-card label {
      font-size: 12px;
      font-weight: 700;
      color: var(--color-text-body);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 6px;
    }
    
    .stat-card .val {
      font-family: 'Outfit', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: var(--color-text-heading);
    }
    
    /* Filters */
    .filter-bar {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }
    
    .search-input {
      flex: 1;
      border: 1.5px solid var(--color-border);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      outline: none;
      font-weight: 550;
      color: var(--color-text-heading);
    }
    
    .search-input:focus {
      border-color: var(--color-primary);
    }
    
    /* Users Table */
    .table-container {
      background-color: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    
    th {
      background-color: #F1F5F9;
      color: var(--color-text-heading);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 14px 20px;
      letter-spacing: 0.5px;
      border-bottom: 1.5px solid var(--color-border);
    }
    
    td {
      padding: 16px 20px;
      border-bottom: 1px solid var(--color-border);
      font-size: 14px;
      color: var(--color-text-heading);
      vertical-align: middle;
    }
    
    tr:last-child td {
      border-bottom: none;
    }
    
    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .user-profile img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: var(--color-border);
    }
    
    .user-profile-info strong {
      display: block;
      font-weight: 700;
    }
    
    .user-profile-info span {
      font-size: 12px;
      color: var(--color-text-body);
    }
    
    .method-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 30px;
      text-transform: uppercase;
    }
    
    .method-badge.google {
      background-color: #EFF6FF;
      color: #1D4ED8;
    }
    
    .method-badge.credentials {
      background-color: #F8FAFC;
      color: var(--color-text-body);
      border: 1px solid var(--color-border);
    }
    
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
    }
    
    .status-pill.verified {
      background-color: #DCFCE7;
      color: #15803D;
    }
    
    .status-pill.pending {
      background-color: #FEF3C7;
      color: #B45309;
    }
    
    /* Toggle verify button */
    .verify-action-btn {
      border: 1.5px solid var(--color-border);
      background-color: #ffffff;
      color: var(--color-text-heading);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .verify-action-btn:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
      background-color: #F0FDFD;
    }
    
    .verify-action-btn.unverify:hover {
      border-color: #EF4444;
      color: #EF4444;
      background-color: #FEF2F2;
    }
    
    .empty-state {
      padding: 40px;
      text-align: center;
      color: var(--color-text-body);
      font-weight: 500;
    }
    
    @media (max-width: 1024px) {
      .stats-row {
        grid-template-columns: 1fr 1fr;
      }
    }
    
    @media (max-width: 640px) {
      .stats-row {
        grid-template-columns: 1fr;
      }
      .admin-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .filter-bar {
        flex-direction: column;
      }
      table, thead, tbody, th, td, tr {
        display: block;
      }
      thead { display: none; }
      tr { border-bottom: 2px solid var(--color-border); padding: 12px 0; }
      td { border: none; padding: 6px 20px; }
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <!-- ADMIN HEADER -->
    <div class="admin-header">
      <div class="admin-title-area">
        <a href="landing.html" style="display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--color-border); color: var(--color-text-heading);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width: 16px; height: 16px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </a>
        <h1>User Verification Portal</h1>
        <span class="admin-badge">Admin</span>
      </div>
      <div style="display: flex; gap: 10px;">
        <a href="admin-dashboard.html" class="view-all" style="background: var(--color-primary); color: #fff; padding: 8px 18px; border-radius: 8px; font-weight: 700;">
          📊 Fleet & Booking Admin
        </a>
        <a href="admin-hotels.html" class="view-all" style="background: transparent; border: 1.5px solid var(--color-border); padding: 8px 18px; border-radius: 8px; font-weight: 700;">
          🏨 Hotel Analytics
        </a>
        <a href="landing.html" class="view-all">
          Main Landing Page
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </a>
      </div>
    </div>
    
    <!-- STATS ROW -->
    <div class="stats-row">
      <div class="stat-card">
        <label>Total Captured Users</label>
        <div class="val" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <label>Google Sign-Ups</label>
        <div class="val" id="stat-google">0</div>
      </div>
      <div class="stat-card">
        <label>Verified Accounts</label>
        <div class="val" id="stat-verified">0</div>
      </div>
      <div class="stat-card">
        <label>Verification Rate</label>
        <div class="val" id="stat-rate">0%</div>
      </div>
    </div>
    
    <!-- HOTEL BOOKING QUICK STATS -->
    <div class="stats-row" id="hotel-quick-stats" style="margin-bottom: 24px;">
      <div class="stat-card" style="border-left: 4px solid var(--color-primary);">
        <label>Hotel Bookings</label>
        <div class="val" id="stat-hotel-bookings">0</div>
      </div>
      <div class="stat-card" style="border-left: 4px solid #22C55E;">
        <label>Today's Check-ins</label>
        <div class="val" id="stat-checkins-today">0</div>
      </div>
      <div class="stat-card" style="border-left: 4px solid #F97316;">
        <label>Today's Check-outs</label>
        <div class="val" id="stat-checkouts-today">0</div>
      </div>
      <div class="stat-card" style="border-left: 4px solid #8B5CF6;">
        <label>Hotel Revenue</label>
        <div class="val" id="stat-hotel-revenue">₹0</div>
      </div>
    </div>
    
    <!-- FILTER BAR -->
    <div class="filter-bar">
      <input type="text" id="admin-search" class="search-input" placeholder="Search user by name or email address..."/>
    </div>
    
    <!-- TABLE CONTAINER -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>User Account</th>
            <th>Email Address</th>
            <th>Auth Method</th>
            <th>Registration Date</th>
            <th>Verification Status</th>
            <th>Admin Action</th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <!-- Populated dynamically -->
        </tbody>
      </table>
      <div id="table-empty" class="empty-state" style="display: none;">
        No user accounts found matching your search.
      </div>
    </div>
  </div>

  <script>
    let allUsers = [];
    const tbody = document.getElementById('users-tbody');
    const emptyState = document.getElementById('table-empty');
    const searchInput = document.getElementById('admin-search');
    
    async function loadUsers() {
      try {
        const res = await fetch('/api/users');
        if (res.ok) {
          allUsers = await res.json();
          renderDashboard(allUsers);
        }
      } catch (err) {
        console.error('Error fetching users:', err);
      }
    }
    
    function renderDashboard(usersList) {
      // Calculate Stats
      const total = usersList.length;
      const google = usersList.filter(u => u.authProvider === 'google').length;
      const verified = usersList.filter(u => u.verified).length;
      const rate = total > 0 ? Math.round((verified / total) * 100) : 0;
      
      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-google').textContent = google;
      document.getElementById('stat-verified').textContent = verified;
      document.getElementById('stat-rate').textContent = `${rate}%`;
      
      // Filter list based on search term
      const query = searchInput.value.toLowerCase().trim();
      const filtered = usersList.filter(u => 
        u.name.toLowerCase().includes(query) || 
        u.email.toLowerCase().includes(query)
      );
      
      // Render rows
      tbody.innerHTML = '';
      
      if (filtered.length === 0) {
        emptyState.style.display = 'block';
        return;
      }
      emptyState.style.display = 'none';
      
      filtered.forEach(user => {
        const tr = document.createElement('tr');
        
        // Format Join Date
        const dateStr = user.createdAt ? new Date(user.createdAt).toLocaleDateString(undefined, {
          year: 'numeric', month: 'short', day: 'numeric'
        }) : 'N/A';
        
        // Status Pill
        const statusHTML = user.verified 
          ? `<span class="status-pill verified">Verified</span>` 
          : `<span class="status-pill pending">Pending</span>`;
          
        // Action Button
        const actionBtnHTML = user.verified
          ? `<button class="verify-action-btn unverify" onclick="toggleVerification('${user.id}', false)">Revoke Status</button>`
          : `<button class="verify-action-btn" onclick="toggleVerification('${user.id}', true)">Verify Email</button>`;
          
        tr.innerHTML = `
          <td>
            <div class="user-profile">
              <img src="${user.picture || 'https://i.pravatar.cc/80'}" alt="${user.name}"/>
              <div class="user-profile-info">
                <strong>${user.name}</strong>
                <span>ID: ${user.id}</span>
              </div>
            </div>
          </td>
          <td>${user.email}</td>
          <td>
            <span class="method-badge ${user.authProvider}">
              ${user.authProvider}
            </span>
          </td>
          <td>${dateStr}</td>
          <td id="status-cell-${user.id}">${statusHTML}</td>
          <td id="action-cell-${user.id}">${actionBtnHTML}</td>
        `;
        
        tbody.appendChild(tr);
      });
    }
    
    async function toggleVerification(userId, verifiedState) {
      try {
        const res = await fetch('/api/users/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: userId, verified: verifiedState })
        });
        
        if (res.ok) {
          // Reload dashboard content
          await loadUsers();
        }
      } catch (err) {
        console.error('Error toggling verification:', err);
      }
    }
    
    // Live Search
    searchInput.addEventListener('input', () => {
      renderDashboard(allUsers);
    });
    
    // Load Hotel Booking Quick Stats
    async function loadHotelStats() {
      try {
        const token = localStorage.getItem('token');
        if (!token) return;
        
        const res = await fetch('/api/hotel-bookings/admin/all', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) return;
        
        const bookings = await res.json();
        const today = new Date().toISOString().split('T')[0];
        
        const totalBookings = bookings.length;
        const todayCheckins = bookings.filter(b => b.checkIn && b.checkIn.split('T')[0] === today && b.bookingStatus !== 'cancelled').length;
        const todayCheckouts = bookings.filter(b => b.checkOut && b.checkOut.split('T')[0] === today && b.bookingStatus !== 'cancelled').length;
        const totalRevenue = bookings.filter(b => b.paymentStatus === 'paid').reduce((s, b) => s + (b.totalAmount || 0), 0);
        
        document.getElementById('stat-hotel-bookings').textContent = totalBookings;
        document.getElementById('stat-checkins-today').textContent = todayCheckins;
        document.getElementById('stat-checkouts-today').textContent = todayCheckouts;
        document.getElementById('stat-hotel-revenue').textContent = '₹' + totalRevenue.toLocaleString();
      } catch (err) {
        console.error('Error loading hotel stats:', err);
      }
    }

    async function checkAuth() {
      try {
        const r = await fetch('/api/admin/check', { credentials: 'include' });
        if (!r.ok) throw new Error();
        // Authorized, load data
        await loadUsers();
        await loadHotelStats();
      } catch (err) {
        console.error('Auth verification failed, redirecting to login:', err);
        window.location.href = 'admin-login.html';
      }
    }

    // Load data at startup with verification check
    checkAuth();
  </script>
</body>
</html>
